[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-file-organizer"
dynamic = ["version"]
description = "AI-powered local file management with state-of-the-art models"
authors = [
    {name = "Local File Organizer Team", email = "noreply@example.com"}
]
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.11"
keywords = ["file-management", "ai", "organization", "local-llm", "privacy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core AI inference
    "ollama>=0.1.0",  # 0.x — unstable API, keep >=

    # File processing (core image only)
    "Pillow~=12.0",

    # NLP and data science
    # Deterministic, offline stemming (WP-4.4, #1234) — pure-Python, no corpus download.
    "snowballstemmer>=2.2",
    # Deliberately NOT ~= style — a ~= rewrite (#1037) would cap this <2.0 again:
    # numpy 1.26.4 is the last release with cp311 wheels but has none for 3.13+;
    # numpy 2.1+ is required for Python 3.13, 2.3+ for 3.14, and opencv-python
    # >=4.13 requires numpy>=2. Floor matches scipy>=1.17's own floor (1.26.4).
    # Capped <2.5 while requires-python is >=3.11: numpy 2.5 dropped 3.11 AND
    # its stubs use PEP 695 `type` statements, which mypy rejects under
    # python_version = "3.11" (our floor). numpy 2.4.x ships cp311-cp314
    # wheels, so one version still covers the whole support matrix.
    "numpy>=1.26.4,<2.5",  # Numerical computing (used in dedup, video, optimization)
    "tqdm~=4.66",  # Progress bars (used in CLI dedup)

    # Security: XXE/entity-expansion-safe XML parsing (dedup ODT content.xml).
    # Core dep — tiny, pure-Python — so the hardening is always active.
    "defusedxml>=0.7",

    # CLI and UI
    # Upper-bounded below 0.26: typer 0.26.0 switched to vendoring its own
    # internal click fork (typer._click) instead of using the real `click`
    # package for its Context/Command machinery. Our code calls real
    # click.get_current_context() (cli/state.py) and builds real click.Context
    # objects (cli/lazy.py) — under the vendored fork those never observe
    # typer's own context stack, so state set in a callback silently reads
    # back as defaults (issue: CLIState.debug/verbose always False, lazy
    # subcommand --help exits 1 instead of 0). 0.25.x still uses real click.
    "typer[all]>=0.12,<0.26",
    "rich~=15.0",
    "textual~=0.50",

    # API and async
    "fastapi~=0.109",
    "starlette~=1.3",  # Direct imports: BaseHTTPMiddleware, Response, WebSocketState
    "aiofiles~=23.0",  # Required by Starlette StaticFiles for async file serving
    "jinja2~=3.1",
    "markupsafe~=3.0",  # Direct import in web csrf_input; also a jinja2 transitive dep
    "uvicorn[standard]~=0.27",
    "websockets>=12.0,<17",  # 12.0 C wheels stop at cp312 (pure-py fallback on 3.13+); uvicorn[standard] needs only >=10.4
    "httpx~=0.26",
    "python-multipart>=0.0.9",  # 0.x — unstable API, keep >=
    # Pygments is transitive via rich/textual. Pin >= 2.20.0 for CVE-2026-4539.
    "Pygments>=2.20.0",
    "pyjwt~=2.8",
    "bcrypt>=4.0.0,<6.0.0",
    # Database
    "sqlalchemy~=2.0",
    "alembic~=1.13",

    # Task queue
    "redis~=8.0",
    # Configuration
    "pyyaml~=6.0",  # YAML config parsing
    "platformdirs~=4.10",  # Cross-platform config/data directory resolution

    # Utilities
    "pydantic~=2.5",
    "pydantic-settings~=2.1",
    "email-validator~=2.1",
    "python-dotenv~=1.0",
    "click~=8.1",
    # Upper bound <7 (not ~=3.0): watchdog 3.0 ships no macOS wheels past cp311
    # and no py3-none-any wheel, so macOS on Python 3.12+ falls back to an
    # fsevents sdist build. watchdog 6.0 ships cp313+ macOS wheels.
    "watchdog>=3.0,<7",  # File system event handler

    # System utilities
    "psutil>=5.9,<8",  # System resource monitoring; 5.9.x abi3 wheels predate Python 3.13/3.14

    # Logging
    "loguru>=0.7.0",  # 0.x — unstable API, keep >=
]

[project.optional-dependencies]
parsers = [
    "PyMuPDF~=1.23",
    "python-docx~=1.0",
    "openpyxl~=3.1",
    "python-pptx>=0.6.0",  # 0.x — unstable API, keep >=
    "ebooklib>=0.20,<1",  # 0.x — unstable API; 0.20 added the isinstance guard around os.path.isdir required for SafeDir's fileobj read path (WP-2.1 / #264)
    "beautifulsoup4~=4.12",
    "lxml~=6.1",
]

web = [
    "fastapi~=0.109",
    "jinja2~=3.1",
    "uvicorn[standard]~=0.27",
    "websockets>=12.0,<17",  # 12.0 C wheels stop at cp312 (pure-py fallback on 3.13+); uvicorn[standard] needs only >=10.4
    "httpx~=0.26",
    "python-multipart>=0.0.9",  # 0.x — unstable API, keep >=
    # Pygments is transitive via rich/textual. Pin >= 2.20.0 for CVE-2026-4539.
    "Pygments>=2.20.0",
    "pyjwt~=2.8",
    "bcrypt>=4.0.0,<6.0.0",

    "redis~=8.0",
]

dev = [
    "pytest~=9.0.3",
    "pytest-asyncio~=1.4",
    "pytest-cov>=4.1,<8",  # 4.1 predates pytest 9 / Python 3.13+; allow current major
    "pytest-mock~=3.12",
    "pytest-timeout>=2.2.0,<2.5.0",  # 2.4.0 regression: timer thread not cancelled on Windows; crashes during teardown (AssertionError in read_global_capture)
    "pytest-xdist~=3.5",
    "pytest-randomly~=3.15",
    "mypy>=1.8,<1.20",  # 1.20.x INTERNAL ERROR (crash) on src/file_organizer/models/*.py; cap until upstream fix
    "types-PyYAML~=6.0",
    "ruff>=0.1.0",  # 0.x — unstable API, keep >=
    "black>=23.12,<27.0",
    "isort~=5.13",
    "pre-commit~=3.6",
    "codespell~=2.2",
    "faker~=40.12",
    "pytest-benchmark>=4.0,<6",  # 5.x drops benchmark_* ini keys; we pass them via CLI (see pytest note below)
    "interrogate~=1.5",  # Docstring coverage measurement
    "pymarkdownlnt>=0.9.25",  # 0.x — unstable API, keep >=; Markdown linting
    "deptry>=0.16.0",  # 0.x — unstable API, keep >=; Unused dependency detection
    "diff-cover~=7.0",  # Diff coverage gate (local pre-commit + CI validation)
    "asgi-lifespan~=2.1",  # ASGI lifespan management for integration tests
    "pytest-playwright>=0.5.0",  # Browser-based E2E smoke tests (requires: playwright install chromium)
    "axe-playwright-python>=0.1.7",  # axe-core a11y smoke checks for Playwright tests
]

cloud = [
    "openai~=2.44",  # OpenAI-compatible API provider (OpenAI, Groq, LM Studio, vLLM)
]

llama = [
    # Security note (2026-03-16): diskcache 5.6.3 (GHSA-w8v5-vhqr-4h9v) is a transitive
    # dep of llama-cpp-python. Risk accepted: diskcache is never imported or called by
    # application code. No patched version exists upstream.
    "llama-cpp-python>=0.2.0",  # 0.x — unstable API, keep >=; llama.cpp C bindings
]

mlx = [
    "mlx-lm>=0.0.19; platform_system == 'Darwin'",  # MLX runtime is only supported on Darwin
]

claude = [
    "anthropic>=0.20.0",  # 0.x — unstable API, keep >=; Anthropic Claude API provider
]

gui = [
    "PyQt6~=6.6",
]

desktop = [
    # pywebview wraps the OS-native webview engine (WebKit on macOS/Linux,
    # Edge WebView2 on Windows) — no Chromium/Electron overhead.
    # 0.x numbering ended at 3.x; project uses SemVer from 4.0 onward.
    "pywebview>=4.4",
    # Server-side deps required at runtime inside the desktop process.
    "uvicorn[standard]~=0.27",
]

audio = [
    "faster-whisper~=1.0",
    "torch~=2.1",  # GPU acceleration for audio transcription
    "mutagen~=1.47",  # Audio metadata extraction
    "tinytag>=1.10,<3.0",  # Lightweight audio metadata fallback
    "pydub>=0.25.0",  # 0.x — unstable API, keep >=; Audio manipulation
    # pydub 0.25.x imports stdlib `audioop`, removed in Python 3.13 (PEP 594);
    # audioop-lts is the PSF-blessed shim that restores it on 3.13+.
    "audioop-lts; python_version >= '3.13'",
]

video = [
    "opencv-python~=4.8",  # Video frame processing
    "scenedetect[opencv]>=0.6.0",  # 0.x — unstable API, keep >=; Scene detection algorithms
]

dedup = [
    # No wheels past cp312, so 3.13+ builds from sdist — install-probed on
    # 3.13.2 and 3.14.6 (2026-07): the Cython extension compiles and PHash
    # round-trips. Validated continuously by the ci-extras matrix.
    "imagededup>=0.3.0",  # 0.x — unstable API, keep >=; Image similarity and duplicate detection
    "scikit-learn~=1.4",  # ML-based text similarity for deduplication
    "pypdf>=4,<7",  # PDF text extraction fallback in dedup extractor
    "striprtf>=0.0.26",  # 0.x — unstable API, keep >=; RTF file text extraction in dedup extractor
]

archive = [
    "py7zr>=0.20.0",  # 0.x — unstable API, keep >=; 7Z archive support
    "rarfile~=4.1",  # RAR archive support (requires unrar tool)
]

scientific = [
    "h5py~=3.10",  # HDF5 file format support
    "netCDF4~=1.6",  # NetCDF file format support
    "scipy~=1.11",  # MATLAB .mat file support
]

cad = [
    "ezdxf~=1.1",  # DXF/DWG CAD file format support
]

build = [
    "pyinstaller~=6.0",  # Cross-platform executable packaging
]

docs = [
    "mkdocs~=1.5",
    "mkdocs-material~=9.5",
    "pymdown-extensions~=11.0",
    "mkdocs-minify-plugin>=0.8.0",  # 0.x — unstable API, keep >=
    "mkdocstrings[python]>=0.24.0",  # 0.x — unstable API, keep >=
]

search = [
    "rank-bm25>=0.2.0",  # 0.x — unstable API, keep >=
    "scikit-learn~=1.4",
]

all = [
    "local-file-organizer[dev,gui,cloud,llama,mlx,claude,audio,video,dedup,archive,scientific,cad,build,parsers,web,search]",
]

[project.scripts]
file-organizer = "file_organizer.cli:main"
fo = "file_organizer.cli:main"  # Short alias
file-organizer-desktop = "file_organizer.desktop.app:launch"  # Native desktop window (requires [desktop] extra)

[project.urls]
Homepage = "https://github.com/curdriceaurora/Local-File-Organizer"
Documentation = "https://github.com/curdriceaurora/Local-File-Organizer#readme"
Repository = "https://github.com/curdriceaurora/Local-File-Organizer"
Issues = "https://github.com/curdriceaurora/Local-File-Organizer/issues"
Changelog = "https://github.com/curdriceaurora/Local-File-Organizer/releases"

[tool.setuptools.dynamic]
version = {attr = "file_organizer.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
file_organizer = [
    "py.typed",
    "config/*.yaml",
    "web/templates/**/*.html",
    "web/static/**/*",
]

# Ruff configuration (linting and formatting)
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv*/",
    "technical-debt/",
    "fix_coderabbit_issues.py",
    "test_preference_tracker.py",
]
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C901", # mccabe complexity
    "UP",  # pyupgrade
    "D",   # pydocstyle (google convention)
    "RUF100",  # stale noqa comments
    "DTZ",  # datetime timezone rules (DTZ001-DTZ007, DTZ011-DTZ012)
    "S113", # requests calls without explicit timeout
    "PT012", # pytest.raises() block must contain a single simple statement (WP-6.4, #1243)
    "PT017", # assertion on exception in except block — use pytest.raises() (WP-6.4, #1243)
    "PT022", # useless yield fixture without teardown — use return (WP-6.4, #1243)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ANN401", # **kwargs: Any is acceptable in abstract/polymorphic interfaces
]
external = ["G1", "G2", "G3", "G4", "G5"]  # grep-based pre-commit hook codes (WP-6.4, #1243); not real ruff rules, reserved so RUF100 doesn't flag `# noqa: G1` etc.

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]
"scripts/docker_utils.py" = ["D", "C901"]
# C901 ratchet baseline — functions exceeding complexity 15 (2026-02-28)
# Each entry allows existing complex functions; new ones must stay under 15.
# Note: 9 files refactored in 2026-03 (task 005), 3 more in issue #1022.
# Remaining files with complexity > 15:
"src/file_organizer/core/organizer.py" = ["C901"]  # organize: 33

# MyPy configuration (type checking)
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

# WP-6.4 (#1243) ratchet baseline: mypy's gate widened from
# src/file_organizer/models/ to all of src/file_organizer/ on 2026-06-27.
# These files had pre-existing type errors at widening time and are
# exempted until fixed — remove an entry once its file is clean under
# `mypy src/file_organizer/<path>`, do not add new entries for new code.
#
# 10 of these (api.routers.files, api.utils, config.manager,
# config.provider_env, integrations.obsidian, methodologies.para.ai.
# feature_extractor, methodologies.para.config,
# methodologies.para.detection.heuristics, services.copilot.rules.
# rule_manager, web.file_operations) were added after the initial
# survey, which ran on macOS — CI's Linux runner surfaced
# `stat_result.st_birthtime` (BSD/macOS-only) and several
# now-platform-relevant "unused type: ignore" errors that don't
# reproduce locally on Darwin. Reproduced the st_birthtime subset
# locally with `mypy --platform=linux`; trusted CI for the rest.
[[tool.mypy.overrides]]
module = [
    "file_organizer.api.cache",
    "file_organizer.api.config",
    "file_organizer.api.main",
    "file_organizer.api.repositories.file_metadata_repo",
    "file_organizer.api.repositories.job_repo",
    "file_organizer.api.repositories.session_repo",
    "file_organizer.api.repositories.settings_repo",
    "file_organizer.api.repositories.workspace_repo",
    "file_organizer.api.routers",
    "file_organizer.api.routers.auth",
    "file_organizer.api.routers.files",
    "file_organizer.api.routers.organize",
    "file_organizer.api.routers.search",
    "file_organizer.api.service_facade",
    "file_organizer.api.utils",
    "file_organizer.cli.dedupe_hash",
    "file_organizer.cli.dedupe_renderer",
    "file_organizer.cli.interactive",
    "file_organizer.cli.rules",
    "file_organizer.config.manager",
    "file_organizer.config.provider_env",
    "file_organizer.core",
    "file_organizer.core.backend_detector",
    "file_organizer.core.path_guard",
    "file_organizer.desktop.app",
    "file_organizer.integrations.obsidian",
    "file_organizer.methodologies.para.ai.feature_extractor",
    "file_organizer.methodologies.para.config",
    "file_organizer.methodologies.para.detection.heuristics",
    "file_organizer.pipeline.stages.writer",
    "file_organizer.review_regressions.correctness",
    "file_organizer.review_regressions.security",
    "file_organizer.services.audio.utils",
    "file_organizer.services.copilot.rules.rule_manager",
    "file_organizer.services.deduplication.embedder",
    "file_organizer.services.deduplication.image_utils",
    "file_organizer.services.deduplication.semantic",
    "file_organizer.services.intelligence.profile_importer",
    "file_organizer.services.search.embedding_cache",
    "file_organizer.services.search.vector_index",
    "file_organizer.tui.app",
    "file_organizer.tui.setup_wizard_view",
    "file_organizer.utils.epub_enhanced",
    "file_organizer.utils.readers",
    "file_organizer.utils.readers.cad",
    "file_organizer.watcher.monitor",
    "file_organizer.web.csrf",
    "file_organizer.web.file_operations",
    "file_organizer.web.organize_routes",
    "file_organizer.web.profile_routes",
    "file_organizer.web.settings_routes",
]
ignore_errors = true

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=file_organizer",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    # Matches the unit coverage-gate job's enforced floor (ci.yml: coverage report --fail-under=93).
    "--cov-fail-under=93",
    "--timeout=30",
    # Branch coverage baseline (integration tests only):
    # Measured 2026-03-21 via measure-integration-coverage.sh: TOTAL ~49%
    # Enforced floor: 45% branch — lives in .github/workflows/ci.yml (test-integration job).
    # measure-integration-coverage.sh is a local measurement tool only; it does not enforce the floor.
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "ci: marks tests intended for PR CI validation",
    "smoke: marks tests for fast pre-commit validation (<30s total)",
    "security: marks security hardening / regression tests (tests/security)",
    "extras: marks optional-dependency matrix tests (tests/extras)",
    "no_ollama: marks tests that verify fallback behavior when Ollama is unavailable",
    "regression: marks tests intended for full regression runs",
    "e2e: end-to-end tests against real file trees (no Ollama required)",
    "benchmark: performance benchmark tests (use --benchmark-only to run)",
    "uses_setup_gate: opts out of the autouse setup-gate bypass to exercise the real gate",
    "asyncio: marks tests as async (requires pytest-asyncio)",
    "keep_default_paths: opts out of the autouse tmp_path re-routing in TUI conftest (use on tests that verify default '.' path behaviour)",
    "playwright: browser-based E2E tests (requires `playwright install <browser>` for chromium, firefox, or webkit; select with --browser=<name>; run with --override-ini='addopts=')",
]
filterwarnings = [
    "error::DeprecationWarning:file_organizer",
    "error::PendingDeprecationWarning:file_organizer",
    # Starlette's TestClient now warns that it prefers optional httpx2 support.
    # The project still has first-party httpx usage pinned to 0.x; keep this scoped
    # test-only warning ignored until a coordinated dependency migration is done.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:google",
    "ignore::DeprecationWarning:importlib",
    "ignore::pytest_benchmark.logger.PytestBenchmarkWarning",
    # FileBrowserTree.set_extension_filter calls Textual's DirectoryTree.reload(), which is an
    # async coroutine.  In unit tests there is no running event loop, so the RuntimeError is
    # caught in file_browser.py, but Python still garbage-collects the unawaited coroutine and
    # emits this RuntimeWarning.  This is a Textual upstream design issue (reload() should
    # guard against being called outside an event loop); suppress until resolved upstream.
    # See: src/file_organizer/tui/file_browser.py :: FileBrowserTree.set_extension_filter
    "ignore:coroutine 'DirectoryTree.*' was never awaited:RuntimeWarning",
]
# pytest-benchmark settings (pass via CLI: --benchmark-min-rounds=3 --benchmark-max-time=30.0)
# benchmark_ prefix keys are NOT supported as ini_options in pytest-benchmark 5.x

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
concurrency = ["multiprocessing", "thread"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    # Lines with an inline safedir-required exemption are already reviewed
    # and approved raw-I/O callsites; they don't need diff-cover gates.
    "noqa: safedir-required",
]

# Interrogate configuration (docstring coverage)
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
fail-under = 95
exclude = ["tests", "setup.py", "docs"]
verbose = 1
quiet = false
whitelist-regex = []

# deptry: unused dependency detection
# Run as: deptry src/  (scans source only)
[tool.deptry]
# First-party package — suppress DEP001 false positives from src-layout
known_first_party = ["file_organizer"]
# Only tool-only groups where packages are never imported in application code
pep621_dev_dependency_groups = ["dev", "docs", "build"]
# Map distribution names → import names for packages that differ
[tool.deptry.package_module_name_map]
"Pillow" = "PIL"
"PyMuPDF" = "fitz"
"python-docx" = "docx"
"python-pptx" = "pptx"
"beautifulsoup4" = "bs4"
"pyyaml" = "yaml"
"pyjwt" = "jwt"
"scikit-learn" = "sklearn"
"opencv-python" = "cv2"
"pydantic-settings" = "pydantic_settings"
"pypdf" = "pypdf"
"striprtf" = "striprtf"
"llama-cpp-python" = "llama_cpp"
"mlx-lm" = "mlx_lm"
"pywebview" = "webview"
[tool.deptry.per_rule_ignores]
# netCDF4: in scientific optional group; deptry has mixed-case matching issues
DEP001 = ["netCDF4"]
# aiofiles: Starlette StaticFiles uses it for async file serving (no direct import)
# python-multipart: FastAPI uses it for file uploads (no direct import)
# lxml: used as bs4 parser string "lxml" (not imported directly)
# email-validator: pydantic uses it for EmailStr (not imported directly)
# websockets: starlette WebSocket support (must be installed, not imported)
# python-dotenv: pydantic-settings reads .env files via this package
# jinja2: fastapi.templating wraps it (not imported directly)
# alembic: used as CLI migration tool (not imported in application code)
# openpyxl: pandas uses it for Excel I/O (not imported directly)
# local-file-organizer: self-reference in the [all] optional group
DEP002 = [
    "aiofiles",
    "python-multipart",
    "lxml",
    "email-validator",
    "websockets",
    "python-dotenv",
    "jinja2",
    "alembic",
    "openpyxl",
    "local-file-organizer",
    # pydantic-settings: pydantic's BaseSettings uses it internally; no direct import needed
    "pydantic-settings",
    # PyQt6: GUI-only dep; GUI application lives outside src/file_organizer/
    "PyQt6",
    # netCDF4: mixed-case name causes deptry matching issues; used in scientific.py
    "netCDF4",

    # Pygments: transitive via rich/textual; pinned for CVE-2026-4539
    "Pygments",
    # pywebview: desktop GUI wrapper; import name is 'webview' (mapped above); used in desktop/app.py
    "pywebview",
    # audioop-lts: restores stdlib `audioop` on Python 3.13+ for pydub (never imported directly)
    "audioop-lts",
]

