<div class="modal-backdrop" data-modal-close></div>
<div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="rename-modal-title">
    <div class="modal-header">
        <div>
            <p class="modal-kicker">File action</p>
            <h2 class="modal-title" id="rename-modal-title">Rename file</h2>
        </div>
        <button class="modal-close" type="button" data-modal-close>Close</button>
    </div>
    <div class="modal-body">
        <form hx-post="/ui/files/rename" hx-target="#file-results" hx-swap="innerHTML">
            <input type="hidden" name="path" value="{{ path }}">
            <label for="new-name">New filename</label>
            <input id="new-name" name="new_name" type="text" required placeholder="Enter new filename">
            <div class="form-actions">
                <button class="btn-primary" type="submit">Rename</button>
                <button class="btn-ghost" type="button" data-modal-close>Cancel</button>
            </div>
        </form>
    </div>
</div>
