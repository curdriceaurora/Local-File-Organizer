name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.0.0)'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux-only: we ship binaries (CLI + desktop + AppImage) for Linux
          # only. macOS and Windows are supported and CI-verified — the full
          # suite runs on those OSes in ci-full.yml plus the python-probe
          # matrix — but their unsigned executables carry Gatekeeper/SmartScreen
          # friction, so those platforms install via pip/pipx instead.
          - os: ubuntu-latest
            platform: linux
            arch: x86_64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pywebview Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-webkit2-4.1 \
            fuse \
            libfuse2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"
          pip install pyinstaller

      - name: Run tests
        run: |
          pytest -q --override-ini="addopts=" --tb=short tests/ci/test_build_artifacts.py tests/ci/test_build_workflow.py tests/ci/test_build_workflows.py

      - name: Build CLI executable
        run: |
          python scripts/build.py --clean

      - name: Build Desktop executable
        run: |
          python scripts/build.py --desktop

      - name: Build AppImage
        if: matrix.platform == 'linux'
        run: |
          bash scripts/build_linux.sh

      - name: Verify executables
        shell: bash
        run: |
          cli_exe=$(find dist -maxdepth 1 -type f -name "file-organizer-*" -not -name "*desktop*" | head -1)
          desktop_exe=$(find dist -maxdepth 1 -type f -name "file-organizer-desktop-*" | head -1)

          if [ -z "$cli_exe" ]; then
            echo "ERROR: No CLI executable found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "CLI executable: $cli_exe ($(du -h "$cli_exe" | cut -f1))"

          if [ -z "$desktop_exe" ]; then
            echo "ERROR: No desktop executable found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "Desktop executable: $desktop_exe ($(du -h "$desktop_exe" | cut -f1))"

          # Basic smoke test for CLI
          "$cli_exe" --help || true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: file-organizer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 30

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/
          cp dist/*.whl dist/*.tar.gz artifacts/

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f \( -name "file-organizer*" -o -name "*.exe" -o -name "*.whl" -o -name "*.tar.gz" \) | while read -r f; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Build release notes from CHANGELOG
        run: |
          if python scripts/extract_changelog.py "${RELEASE_TAG}" > release-notes.md; then
            echo "Using CHANGELOG section for ${RELEASE_TAG}."
          else
            echo "No CHANGELOG section for ${RELEASE_TAG}; relying on generated notes."
            : > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Curated CHANGELOG section on top; softprops appends the
          # auto-generated PR list below it (generate_release_notes).
          body_path: release-notes.md
          files: |
            artifacts/**/*
          draft: ${{ !(contains(env.RELEASE_TAG, '-') || contains(env.RELEASE_TAG, 'a') || contains(env.RELEASE_TAG, 'b') || contains(env.RELEASE_TAG, 'rc')) }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') || contains(env.RELEASE_TAG, 'a') || contains(env.RELEASE_TAG, 'b') || contains(env.RELEASE_TAG, 'rc') }}
          generate_release_notes: true
