name: Build Executables

on:
  push:
    tags:
      - 'v*'
  # checkov:skip=CKV_GHA_7:Manual build version parameter is required for workflow_dispatch trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.0.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux-only: we ship binaries (CLI + desktop + AppImage) for Linux
          # only. macOS and Windows are supported and CI-verified — the full
          # suite runs on those OSes in ci-full.yml plus the python-probe
          # matrix — but their unsigned executables carry Gatekeeper/SmartScreen
          # friction, so those platforms install via pip/pipx instead.
          - os: ubuntu-latest
            platform: linux
            arch: x86_64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install pywebview Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-webkit2-4.1 \
            fuse \
            libfuse2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"
          pip install pyinstaller

      - name: Run tests
        run: |
          pytest -q --override-ini="addopts=" --tb=short tests/ci/test_build_artifacts.py tests/ci/test_build_workflow.py tests/ci/test_build_workflows.py

      - name: Build CLI executable
        run: |
          python scripts/build.py --clean

      - name: Build Desktop executable
        run: |
          python scripts/build.py --desktop

      - name: Build AppImage
        if: matrix.platform == 'linux'
        run: |
          bash scripts/build_linux.sh

      - name: Verify executables
        shell: bash
        run: |
          cli_exe=$(find dist -maxdepth 1 -type f -name "file-organizer-*" -not -name "*desktop*" | head -1)
          desktop_exe=$(find dist -maxdepth 1 -type f -name "file-organizer-desktop-*" | head -1)

          if [ -z "$cli_exe" ]; then
            echo "ERROR: No CLI executable found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "CLI executable: $cli_exe ($(du -h "$cli_exe" | cut -f1))"

          if [ -z "$desktop_exe" ]; then
            echo "ERROR: No desktop executable found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "Desktop executable: $desktop_exe ($(du -h "$desktop_exe" | cut -f1))"

          # Basic smoke test for CLI
          "$cli_exe" --help || true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: file-organizer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 30

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No later step pushes/pulls with the token (softprops uses the job's
          # GITHUB_TOKEN directly), so don't persist git credentials on disk.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build pycryptodomex loguru httpx
          python -m build --outdir dist/
          cp dist/*.whl dist/*.tar.gz artifacts/

      - name: Generate and sign release manifest
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python scripts/sign_release.py

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f \( -name "file-organizer*" -o -name "*.exe" -o -name "*.whl" -o -name "*.tar.gz" \) | while read -r f; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Build release notes from CHANGELOG
        run: |
          if python scripts/extract_changelog.py "${RELEASE_TAG}" > release-notes.md; then
            echo "Using CHANGELOG section for ${RELEASE_TAG}."
          else
            echo "No CHANGELOG section for ${RELEASE_TAG}; relying on generated notes."
            : > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t release_files < <(find artifacts -type f | sort)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release files found under artifacts/"
            exit 1
          fi

          args=(
            release create "${RELEASE_TAG}"
            "${release_files[@]}"
            --notes-file release-notes.md
            --generate-notes
          )

          if [[ "${RELEASE_TAG}" != *-* && "${RELEASE_TAG}" != *a* && "${RELEASE_TAG}" != *b* && "${RELEASE_TAG}" != *rc* ]]; then
            args+=(--draft)
          else
            args+=(--prerelease)
          fi

          gh "${args[@]}"
