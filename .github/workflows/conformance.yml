name: Conformance

# Parity conformance scaffold (#1605). The main CI workflow only triggers for
# PRs based at main/epic/**, so this workflow adds coverage for the parity
# integration branch itself. Promoted to required gate in #1606 per the
# gate-promotion policy in docs/architecture/cross-surface-parity-execution.md.
on:
  push:
    branches: [main, "epic/**", feature/cross-surface-parity]
  pull_request:
    branches: [main, "epic/**", feature/cross-surface-parity]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: "Conformance suite"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/file_organizer/client/typescript/package-lock.json
      - name: Install dependencies
        run: pip install -e ".[dev,search]"
      - name: Verify TypeScript SDK contract
        working-directory: src/file_organizer/client/typescript
        run: npm ci --ignore-scripts && npm test
      - name: Run conformance suite
        run: pytest tests/conformance --strict-markers -m conformance --timeout=30 --override-ini="addopts="
