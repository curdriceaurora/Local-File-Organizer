name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@39431830520a7ae6c0c572f11a7707e7043325e3
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
