name: Extras Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/file_organizer/**"
      - ".github/workflows/ci-extras.yml"
      - "scripts/pip_install_retry.sh"
  schedule:
    - cron: "0 7 * * 1"  # Weekly on Monday at 07:00 UTC, after the Security workflow

permissions:
  contents: read

jobs:
  install-extra:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra:
          - audio
          - video
          - dedup
          - archive
          - scientific
          - cad
          - parsers
          - web
          - gui
          - desktop
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install with extra "${{ matrix.extra }}" in isolation
        run: bash scripts/pip_install_retry.sh -e ".[${{ matrix.extra }}]"
      - name: Smoke-import the package
        run: python -c "import file_organizer; print('import OK')"
