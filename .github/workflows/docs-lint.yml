name: Lint Markdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pymarkdown
        run: pip install 'pymarkdownlnt==0.9.25'
      - name: Run markdown linting
        run: |
          # Scan all tracked markdown files in repository (including nested)
          # using git ls-files to match pre-commit hook behavior.
          # Legacy MD031 violation files are excluded during the burn-down phase;
          # the CI ratchet test (tests/ci/test_md031_ratchet.py) tracks the global
          # count and blocks any net increase. Remove entries as violations are fixed.
          # LEGACY_EXCLUDE must stay in sync with the 'exclude' regex in the
          # pymarkdown hook in .pre-commit-config.yaml.  Update both together.
          LEGACY_EXCLUDE='^(docs/internal/|docs/testing/|docs/developer/testing\.md|\.github/copilot-instructions\.md|src/file_organizer/services/deduplication/README_IMAGE_DEDUP\.md|tests/fixtures/)'
          mapfile -t FILES < <(git ls-files '*.md' | grep -vE "$LEGACY_EXCLUDE" || true)
          if (( ${#FILES[@]} )); then
            pymarkdown -c .pymarkdown.json scan -- "${FILES[@]}"
          fi
