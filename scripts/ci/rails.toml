# CI-rail registry — WP-0.1 scaffolding (#1222).
#
# Rails declared here are run by `scripts/ci/ci_rails.py`. Each [[rail]] is:
#
#   name        unique rail identifier
#   command     argv list to execute (exit 0 = pass, non-zero = fail)
#   mode        "advisory" — warn on failure, never fail the run (default)
#               "enforce"  — fail the run (exit 1) on failure
#   description what the rail guards
#
# WP-6.x authors rails as mode = "advisory" and flips each to mode = "enforce"
# only once the code it guards has merged.
# See issue #1356 for the follow-up decision on enforcing advisory rails.

[[rail]]
name = "safedir-required"
command = ["python", "scripts/ci/guardrails/check_safedir_required.py"]
mode = "enforce"
description = "Flags raw open(), Path.open(), and shutil copy/move functions on caller-supplied paths (WP-6.1)."

[[rail]]
name = "raw-filesystem-traversal"
command = ["python", "scripts/ci/guardrails/check_raw_filesystem_traversal.py"]
mode = "enforce"
description = "Flags raw filesystem enumeration outside the exact reviewed safe_walk exemption inventory (issue #1736)."

[[rail]]
name = "atomic-write"
command = ["python", "scripts/ci/guardrails/check_atomic_write.py"]
mode = "enforce"
description = "Flags raw file write operations, enforcing the use of atomic_write (WP-6.1)."

[[rail]]
name = "cli-path-validation"
command = ["python", "scripts/ci/guardrails/check_cli_path_validation.py"]
mode = "enforce"
description = "Ensures all CLI command path arguments are validated before use (WP-6.1)."

[[rail]]
name = "cli-file-kind-validation"
command = ["python", "scripts/ci/guardrails/check_cli_file_kind_validation.py"]
mode = "advisory"
description = "Ensures file/directory kind is validated at CLI boundaries after resolve_cli_path (WP-6.1)."

[[rail]]
name = "defusedxml-fallback"
command = ["python", "scripts/ci/guardrails/check_defusedxml_fallback.py"]
mode = "enforce"
description = "Enforces using defusedxml instead of standard library xml (WP-6.1)."

[[rail]]
name = "test-hardcoded-paths"
command = ["python", "scripts/ci/guardrails/check_test_hardcoded_paths.py"]
mode = "enforce"
description = "Flags hardcoded absolute system paths in tests, promoting tmp_path instead (WP-6.2)."

[[rail]]
name = "test-separator-paths"
command = ["python", "scripts/ci/guardrails/check_test_separator_paths.py"]
mode = "enforce"
description = "Flags hardcoded path separators in Path() calls in tests, promoting the / operator (WP-6.2)."

[[rail]]
name = "pytest-raises-hygiene"
command = ["python", "scripts/ci/guardrails/check_pytest_raises_hygiene.py"]
mode = "enforce"
description = "Ensures pytest.raises on generic/built-in exceptions specifies a match regex (WP-6.2)."

[[rail]]
name = "safedir-valueerror"
command = ["python", "scripts/ci/guardrails/check_safedir_valueerror.py"]
mode = "enforce"
description = "Flags broad except blocks that swallow SafeDir's path-safety ValueError (WP-6.1)."

[[rail]]
name = "textiowrapper-detach"
command = ["python", "scripts/ci/guardrails/check_textiowrapper_detach.py"]
mode = "enforce"
description = "Flags io.TextIOWrapper instances that are never detach()-ed before going out of scope (WP-6.1)."

[[rail]]
name = "called-attribute-assertion"
command = ["python", "scripts/ci/guardrails/check_called_attribute_assertion.py"]
mode = "enforce"
description = "Flags weak `assert mock.called` / bare `assert mock.call_count` test assertions (WP-6.2)."

[[rail]]
name = "xdist-loadgroup"
command = ["python", "scripts/ci/guardrails/check_xdist_loadgroup.py"]
mode = "enforce"
description = "Reminds to mark tests sharing xdist-wide temp state with xdist_group (WP-6.2)."

[[rail]]
name = "subprocess-returncode"
command = ["python", "scripts/ci/guardrails/check_subprocess_returncode.py"]
mode = "advisory"
description = "Flags subprocess.run() calls where returncode is not checked and check=True is absent (issue #1408)."

[[rail]]
name = "test-environment-leakage"
command = ["python", "scripts/ci/guardrails/check_test_environment_leakage.py"]
mode = "enforce"
description = "Flags tests that mutate class/global state or sys.modules without scoped restoration (issue #1414)."

[[rail]]
name = "global-state-assertion"
command = ["python", "scripts/ci/guardrails/check_global_state_assertions.py"]
mode = "enforce"
description = "Flags tests asserting over process-global channels — the real sys.platform, the logging.Logger class, or a whole captured stream (issue #1721). Enforce from day one: the suite was at zero instances when the rail landed, the five flakes in #1720 having just been fixed."

[[rail]]
name = "unused-patch-argument"
command = ["python", "scripts/ci/guardrails/check_unused_patch_argument.py"]
mode = "enforce"
description = "Flags @patch-injected test parameters never referenced in the test body (issue #1682, epic #1678). Enforced since the static backlog reached zero (wave A, #1690); the commit-time hook still catches new violations on staged lines first."
