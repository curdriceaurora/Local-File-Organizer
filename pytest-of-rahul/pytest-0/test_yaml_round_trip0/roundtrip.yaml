heuristic_weights:
  temporal: 0.25
  content: 0.35
  structural: 0.3
  ai: 0.1
category_thresholds:
  project: 0.75
  area: 0.75
  resource: 0.8
  archive: 0.9
keyword_patterns:
  project:
  - project
  - deadline
  - due
  - sprint
  - milestone
  - deliverable
  - proposal
  - presentation
  area:
  - area
  - ongoing
  - recurring
  - weekly
  - monthly
  - routine
  - maintenance
  resource:
  - reference
  - template
  - guide
  - tutorial
  - documentation
  - handbook
  - manual
  archive:
  - archive
  - old
  - backup
  - deprecated
  - obsolete
  - legacy
  - completed
temporal_thresholds:
  project_max_age: 30
  area_min_age: 30
  area_max_age: 180
  resource_min_age: 60
  archive_min_age: 180
  archive_min_inactive: 90
ai_heuristic:
  model: llama3:8b
  ollama_url: http://localhost:11434
  timeout: 30.0
  max_content_chars: 4096
  temperature: 0.1
  max_tokens: 100
enable_temporal_heuristic: true
enable_content_heuristic: true
enable_structural_heuristic: true
enable_ai_heuristic: true
manual_review_threshold: 0.6
auto_categorize: true
preserve_user_overrides: true
default_root: null
project_dir: Projects
area_dir: Areas
resource_dir: Resources
archive_dir: Archive
